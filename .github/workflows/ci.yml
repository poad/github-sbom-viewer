name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
    - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install pnpm
      uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
      with:
        install: false

    - name: Install global dependencies
      run: pnpm add -g esbuild

    - name: Install dependencies
      run: pnpm install --no-frozen-lockfile

    - name: lint
      run: pnpm lint

    - name: build
      run: pnpm build

    - name: test
      run: pnpm test
