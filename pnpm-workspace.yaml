packages:
  - ./cdk
  - ./app

allowBuilds:
  esbuild: false
  unrs-resolver: false

minimumReleaseAge: 10080 # 7 days in minutes

minimumReleaseAgeExclude:
  - pnpm@12.4.1
  - brace-expansion@5.0.8

overrides:
  brace-expansion@<=5.0.7: ^5.0.8
  chokidar: '>=5'
  semver: '>=7'

trustPolicy: no-downgrade
